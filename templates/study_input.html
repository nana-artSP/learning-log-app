<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習ログ追加</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">学習ログ追加</h2>

    <div class="card p-4 shadow-sm">
        <form id="studyForm">
          <div class="mb-3">
         <label class="form-label">科目</label>
      <select id="subject" class="form-select">
          <option value="">科目を選択してください</option>
          <option value="Python">Python</option>
          <option value="SQL">SQL</option>
          <option value="HTML/CSS">HTML/CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Flask">Flask</option>
          <option value="FastAPI">FastAPI</option>
          <option value="other">その他</option>
     </select>
      <input type="text" id="customSubject" class="form-control mt-2" placeholder="科目を入力してください" style="display:none;">
   </div>

            <div class="mb-3">
                <label class="form-label">学習日</label>
              <div class="d-flex gap-2">
                 <input type="date" id="date" class="form-control">
                 <button type="button" id="todayBtn" class="btn btn-outline-secondary">今日</button>
              </div>
            </div>

            <div class="mb-3">
                <label class="form-label">開始時刻</label>
                <input type="text" id="startTimeDisplay" class="form-control" readonly placeholder="開始ボタンを押してください">
            </div>

            <div class="mb-3">
                <label class="form-label">終了時刻</label>
                <input type="text" id="endTimeDisplay" class="form-control" readonly placeholder="終了ボタンを押してください">
            </div>

            <div class="mb-3">
                <label class="form-label">学習時間（分）</label>
                <input type="number" id="minutes" class="form-control" readonly placeholder="自動計算されます">
            </div>

            <div class="d-flex gap-2 mb-3">
                <button type="button" id="startBtn" class="btn btn-success">開始</button>
                <button type="button" id="endBtn" class="btn btn-warning">終了</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>

        <div id="message" class="mt-3"></div>
    </div>

    <a href="/study_logs" class="btn btn-secondary mt-3">一覧へ戻る</a>
</div>

<script>
    let startTime = null;
    let endTime = null;

    function formatDateTime(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, "0");
        const day = String(dateObj.getDate()).padStart(2, "0");
        const hours = String(dateObj.getHours()).padStart(2, "0");
        const minutes = String(dateObj.getMinutes()).padStart(2, "0");
        const seconds = String(dateObj.getSeconds()).padStart(2, "0");

        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    function formatOnlyDate(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, "0");
        const day = String(dateObj.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    document.getElementById("subject").addEventListener("change", function() {
    const customInput = document.getElementById("customSubject");

    if (this.value === "other") {
        customInput.style.display = "block";
    } else {
        customInput.style.display = "none";
        customInput.value = "";
    }
});

   document.getElementById("todayBtn").addEventListener("click", function() {
    const now = new Date();
    document.getElementById("date").value = formatOnlyDate(now);

    document.getElementById("message").innerHTML =
        "<div class='alert alert-secondary'>今日の日付を入力しました。</div>";
});

    document.getElementById("startBtn").addEventListener("click", function() {
        startTime = new Date();
        document.getElementById("startTimeDisplay").value = formatDateTime(startTime);

        if (!document.getElementById("date").value) {
            document.getElementById("date").value = formatOnlyDate(startTime);
        }

        document.getElementById("message").innerHTML =
            "<div class='alert alert-success'>学習開始時刻を記録しました！</div>";
    });

    document.getElementById("endBtn").addEventListener("click", function() {
        if (!startTime) {
            document.getElementById("message").innerHTML =
                "<div class='alert alert-danger'>先に開始ボタンを押してください。</div>";
            return;
        }

        endTime = new Date();
        document.getElementById("endTimeDisplay").value = formatDateTime(endTime);

        const diffMs = endTime - startTime;
        const diffMinutes = Math.ceil(diffMs / 1000 / 60);

        document.getElementById("minutes").value = diffMinutes;

        document.getElementById("message").innerHTML =
            "<div class='alert alert-info'>学習終了時刻を記録しました！</div>";
    });

    document.getElementById("studyForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        let subject = document.getElementById("subject").value;
        if (subject === "other") {
    subject = document.getElementById("customSubject").value;
}
       if (!subject) {
    document.getElementById("message").innerHTML =
        "<div class='alert alert-danger'>科目を入力してください。</div>";
    return;
}
        const minutes = document.getElementById("minutes").value;
        const date = document.getElementById("date").value;

        if (!subject || !date || !minutes) {
            document.getElementById("message").innerHTML =
                "<div class='alert alert-danger'>科目・日付・学習時間を確認してください。</div>";
            return;
        }

        try {
            const res = await fetch("/study_logs/add", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
    subject: subject,
    minutes: parseInt(minutes),
    date: date,
    start_time: document.getElementById("startTimeDisplay").value,
    end_time: document.getElementById("endTimeDisplay").value
})
            });

            if (!res.ok) {
                throw new Error("保存に失敗しました");
            }

            document.getElementById("message").innerHTML =
                "<div class='alert alert-success'>学習ログを保存しました！一覧へ戻ります。</div>";

            setTimeout(() => {
                window.location.href = "/study_logs";
            }, 1000);

        } catch (error) {
            document.getElementById("message").innerHTML =
                "<div class='alert alert-danger'>保存中にエラーが発生しました。</div>";
            console.error(error);
        }
    });
</script>

</body>
</html>
