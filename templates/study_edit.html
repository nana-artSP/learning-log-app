<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学習ログ編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">学習ログ編集</h2>

        <form action="/study_logs/update/{{ log.id }}" method="post">

            <div class="mb-3">
                <label class="form-label">科目</label>
                <input type="text" name="subject" class="form-control" value="{{ log.subject }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">時間（分）</label>
                <input type="number" name="minutes" class="form-control" value="{{ log.minutes }}" min="1" required>
            </div>

            <div class="mb-3">
                <label class="form-label">日付</label>
                <input type="date" name="date" class="form-control" value="{{ log.date }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">開始時刻</label>
                <input type="text" name="start_time" class="form-control" value="{{ log.start_time }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">終了時刻</label>
                <input type="text" name="end_time" class="form-control" value="{{ log.end_time }}" required>
            </div>


            <div class="d-flex justify-content-between mt-4">
                <a href="/study_logs" class="btn btn-secondary">戻る</a>
                <button type="submit" class="btn btn-primary">更新する</button>
            </div>

        </form>
    </div>

</div>

</body>
</html>
