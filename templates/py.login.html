<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <title>ログイン</title>

  
</head>
<body>
<div class="login-box">
  <h1>ログイン</h1>

  <input type="text" id="loginId" placeholder="メールアドレス">
  <input type="password" id="loginPw" placeholder="パスワードを入力">

  <div id="loginError" style="color: red; margin-top: 8px;"></div>

  <button onclick="login()">ログイン</button>
</div>

<script>
async function login() {
    const email = document.getElementById("loginId").value;
    const password = document.getElementById("loginPw").value;

    const response = await fetch("http://127.0.0.1:5000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
    });

    const data = await response.json();
    const errorBox = document.getElementById("loginError");

    // ログイン成功
    if (data.message === "ok") {
        window.location.href = "/profile";
        return;
    }

    // 失敗時のメッセージ
    if (data.message === "no_user") {
        errorBox.textContent = "残念違うよ♡";
    } else if (data.message === "wrong_pw") {
        errorBox.textContent = "残念違うよ♡";
    }
}
</script>

</body>
</html>
