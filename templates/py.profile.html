<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習ログ管理アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">学習ログ管理アプリ</span>
            <div class="ms-auto">
                <a href="/logout" class="btn btn-outline-light btn-sm">ログアウト</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h1 class="mb-3">学習ログ管理アプリ</h1>
                <p class="text-muted mb-4">
                    日々の学習時間を記録・管理するために作成したWebアプリです。<br>
                    開始・終了時刻を使ったタイムカード風の学習記録にも対応しています。
                </p>

                <div class="mb-4">
                    <p class="mb-1"><strong>ログイン中ユーザー:</strong></p>
                    <p class="text-primary mb-0">{{ session.username }}</p>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <a href="/study_logs" class="btn btn-primary">学習ログ一覧を見る</a>
                    <a href="/study_logs/add" class="btn btn-success">学習ログを追加する</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
